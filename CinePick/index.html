<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Find your next movie by title or genre.">
  <title>CinePick | Movie Recommendations</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to the movie collection</a>

  <header class="hero">
    <div class="container">
      <p class="brand">CinePick</p>
      <h1>Find your next<br class="hero-break"> favourite movie.</h1>
      <p class="intro">Browse a short list of movie picks by title or genre.</p>
      <a class="browse-link" href="#main">Browse movies <span aria-hidden="true">↓</span></a>
    </div>
  </header>

  <main class="container" id="main" tabindex="-1">
    <section aria-labelledby="collection-title">
      <h2 id="collection-title">Movie collection</h2>
      <div class="controls">
        <div class="field">
          <label for="search">Search by title</label>
          <input id="search" type="search" placeholder="Try Inception">
        </div>
        <div class="field">
          <label for="genre">Genre</label>
          <select id="genre">
            <option value="">All genres</option>
          </select>
        </div>
      </div>
      <p class="status" id="status" role="status"></p>

      <ul class="movie-grid" id="movie-list"></ul>

      <noscript><p>Turn on JavaScript to browse the movie collection.</p></noscript>
    </section>
  </main>

  <template id="movie-template">
    <li class="movie-card">
      <div class="movie-art" aria-hidden="true"></div>
      <div class="movie-info">
        <p class="movie-meta"></p>
        <h3 class="movie-title"></h3>
        <p class="movie-description"></p>
      </div>
    </li>
  </template>

  <footer class="container">CinePick · Trailblazer AI Product Studio
    <p>Credits: <a href="chatgpt.com" class="abcd">Chat GPT</a></p>
  </footer>
</body>
</html>
